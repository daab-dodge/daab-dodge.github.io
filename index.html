<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Daab Dodge 🥥</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>

    <div id="menu" class="overlay">
      <h1>🥥 Daab Dodge</h1>
      <p class="sub">Upor theke daab porche — mathay lagle shesh!</p>
      <div class="buttons">
        <button data-diff="easy">😊 Easy <small id="best-easy"></small></button>
        <button data-diff="medium">😬 Medium <small id="best-medium"></small></button>
        <button data-diff="hard">💀 Hard <small id="best-hard"></small></button>
      </div>
      <p class="help">⬅️ ➡️ / A D key, ba screen e finger drag koro</p>
    </div>

    <div id="over" class="overlay hidden">
      <h2>💥 Mathay daab porse!</h2>
      <p id="final-score"></p>
      <p id="final-best"></p>
      <div class="buttons">
        <button id="again">🔁 Abar khelo</button>
        <button id="tomenu">🏠 Menu</button>
      </div>
    </div>

    <div id="touch">
      <button id="left">◀</button>
      <button id="right">▶</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
